name: muse-checkin

on:
  schedule:
    # 避开整点（整点 cron 在 GitHub 高峰期最容易被延迟/丢弃）
    # 02:17 UTC = 北京时间 10:17，主签到（之后随机延迟 1~30 分钟）
    - cron: "17 2 * * *"
    # 05:23 UTC = 北京时间 13:23，补签兜底；已签到 bot 会回“今天已经签到”，幂等
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      skip_delay:
        description: "跳过随机延迟（仅测试用）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Random delay
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.skip_delay) || github.event.schedule == '17 2 * * *' }}
        run: |
          s=$(( RANDOM % 1800 + 60 ))
          echo "random delay: ${s}s (~$((s / 60)) min)"
          sleep "$s"

      - name: Check in
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python checkin.py

      - name: Notify on failure
        if: failure()
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python notify.py
